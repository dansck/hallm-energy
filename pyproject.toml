[project]
name = "hallm-energy"
version = "0.1.0"
description = "Home Assistant integration for grid-charging grants on a home battery system"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-homeassistant-custom-component",
    "ruff>=0.7",
]

# Neni to instalovatelna knihovna (HACS kopiruje custom_components/ primo
# do HA configu) — uv jen spravuje dev venv pro lint/test, nic nebuildi.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
